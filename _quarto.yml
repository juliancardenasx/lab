project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - "publicaciones/pdf/*.pdf"
    - "publicaciones/img/*"

lang: es

website:
  title: "Networkianos Lab"
  description: "Networkianos Lab: publicaciones, datos, skills de IA y tutoriales del equipo de sociología Networkianos (Universitat de València): Julián Cárdenas y Zeus Domínguez-Rubio."
  site-url: "https://lab.networkianos.com"
  favicon: img/favicon.svg
  open-graph: true
  page-navigation: false
  search:
    location: sidebar
    type: textbox
  sidebar:
    # Menú en español
    - id: es
      style: docked
      collapse-level: 1
      title: "Networkianos Lab"
      header: "Sociología, redes e inteligencia artificial"
      contents:
        - text: "Inicio"
          href: index.qmd
        - section: "Publicaciones"
          href: publicaciones/index.qmd
          contents: "publicaciones/*.qmd"
        - section: "Datos"
          href: datos/index.qmd
          contents: "datos/*.qmd"
        - section: "Skills de IA"
          href: skills/index.qmd
          contents: "skills/*.qmd"
        - section: "Plugins y conectores"
          href: plugins/index.qmd
          contents: "plugins/*.qmd"
        - section: "Vídeos"
          href: videos/index.qmd
          contents: "videos/*.qmd"
        - section: "Quiénes somos"
          href: quienes-somos.qmd
          contents: "equipo/*.qmd"
      tools:
        - icon: youtube
          href: https://www.youtube.com/@julian.cardenas
          aria-label: YouTube
        - icon: github
          href: https://github.com/juliancardenasx
          aria-label: GitHub
        - icon: globe
          href: https://networkianos.com
          aria-label: Networkianos
    # Menú en inglés
    - id: en
      style: docked
      collapse-level: 1
      title: "Networkianos Lab"
      header: "Sociology, networks and artificial intelligence"
      contents:
        - text: "Home"
          href: en/index.qmd
        - section: "Publications"
          href: en/publications/index.qmd
          contents: "en/publications/*.qmd"
        - section: "Data"
          href: en/data/index.qmd
          contents: "en/data/*.qmd"
        - section: "AI skills"
          href: en/skills/index.qmd
          contents: "en/skills/*.qmd"
        - section: "Plugins and connectors"
          href: en/plugins/index.qmd
          contents: "en/plugins/*.qmd"
        - section: "Videos"
          href: en/videos/index.qmd
          contents: "en/videos/*.qmd"
        - section: "About us"
          href: en/about.qmd
          contents: "en/team/*.qmd"
      tools:
        - icon: youtube
          href: https://www.youtube.com/@julian.cardenas
          aria-label: YouTube
        - icon: github
          href: https://github.com/juliancardenasx
          aria-label: GitHub
        - icon: globe
          href: https://networkianos.com
          aria-label: Networkianos
  page-footer:
    left: "© Networkianos · CC BY 4.0"
    right: "[networkianos.com](https://networkianos.com)"

format:
  html:
    theme: [cosmo, theme.scss]
    toc: false
    filters:
      - _listing/enlaces.lua
    smooth-scroll: true
    link-external-newwindow: true
    title-block-style: default
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    include-after-body:
      text: |
        <script>
        (function () {
          var isEn = location.pathname.indexOf('/en/') === 0 || location.pathname === '/en';
          // 1. Las secciones vacías del menú no tienen enlace: se lo ponemos.
          var map = {
            "Publicaciones": "/publicaciones/", "Datos": "/datos/", "Skills de IA": "/skills/",
            "Plugins y conectores": "/plugins/", "Vídeos": "/videos/",
            "Publications": "/en/publications/", "Data": "/en/data/", "AI skills": "/en/skills/",
            "Plugins and connectors": "/en/plugins/", "Videos": "/en/videos/"
          };
          document.querySelectorAll('li.sidebar-item-section > span.sidebar-item-text').forEach(function (el) {
            var t = el.textContent.trim();
            if (!map[t]) return;
            var a = document.createElement('a');
            a.className = 'sidebar-item-text sidebar-link';
            a.href = map[t];
            a.innerHTML = el.innerHTML;
            if (location.pathname.indexOf(map[t]) === 0) a.classList.add('active');
            var wrap = document.createElement('div');
            wrap.className = 'sidebar-item-container';
            wrap.appendChild(a);
            el.replaceWith(wrap);
          });
          // 2. Selector de idioma ES · EN
          var pairs = {
            "/": "/en/", "/index.html": "/en/",
            "/publicaciones/": "/en/publications/", "/datos/": "/en/data/", "/skills/": "/en/skills/",
            "/plugins/": "/en/plugins/", "/videos/": "/en/videos/", "/quienes-somos.html": "/en/about.html",
            "/equipo/julian-cardenas.html": "/en/team/julian-cardenas.html", "/equipo/zeus-dominguez-rubio.html": "/en/team/zeus-dominguez-rubio.html"
          };
          var p = location.pathname.replace(/index\.html$/, '');
          var other = null;
          var alt = document.getElementById('nw-alt');
          if (alt) other = alt.getAttribute('data-href');
          if (!other) {
            for (var k in pairs) {
              var es = k.replace(/index\.html$/, ''), en = pairs[k];
              if (!isEn && p === es) other = en;
              if (isEn && p === en) other = es;
            }
          }
          if (!other) other = isEn ? '/' : '/en/';
          var box = document.createElement('div');
          box.className = 'nw-lang';
          box.innerHTML = isEn
            ? '<a href="' + other + '" lang="es">ES</a><span>EN</span>'
            : '<span>ES</span><a href="' + other + '" lang="en">EN</a>';
          var title = document.querySelector('#quarto-sidebar .sidebar-header');
          if (title) title.appendChild(box);
          var mobile = document.querySelector('.quarto-secondary-nav .container-fluid, .quarto-secondary-nav');
          if (mobile) { var m = box.cloneNode(true); m.classList.add('nw-lang-mobile'); mobile.appendChild(m); }
        })();
        </script>
    grid:
      sidebar-width: 280px
      body-width: 760px
      margin-width: 200px
